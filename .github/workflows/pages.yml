name: Publish site to GitHub Pages

# Publishes site-club/ on every push to main. The site is plain HTML — the only
# "build" is copying the folder and leaving out the test scripts and notes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          rm -rf dist && mkdir dist
          cp -R site-club/. dist/
          rm -rf dist/tests dist/README.md
          echo "jtsrfclub.com" > dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
